# ReinFlow-GRPO: online SDE-policy optimisation on LIBERO.
#
#   pixi run python scripts/train_reinflow_grpo.py --config configs/reinflow_grpo.yaml
#   pixi run python scripts/train_reinflow_grpo.py --config configs/reinflow_grpo.yaml run.lr=3e-6 rl.group_size=4

project:
  wandb_project: "surgical-vla"
  wandb_mode: "disabled"
  entity: null
  run_name: "surgical_vla_reinflow_grpo"
  notes: "ReinFlow-GRPO over flow-matching SDE trajectories"
  tags: ["rl", "grpo", "reinflow", "libero"]

# Which benchmark this run lives in. The checkpoint, its normalisation and the
# simulator must all belong to it (src/surgicalvla/rl/benchmarks.py, audit A10).
benchmark: libero

# LIBERO-SFT starting point: SmolVLA fine-tuned on lerobot/libero (8-D state,
# 7-D eef-delta actions), pinned. Normalisation comes from its saved processors.
# A local smolvla_moe checkpoint trained on LIBERO works the same way.
checkpoint: "lerobot/smolvla_libero"
checkpoint_revision: "a24f1f380461b665158d52acd140152c79e8b36d"
stats:
  path: null                    # null -> use the checkpoint's own policy_preprocessor

libero:
  suite: "libero_10"
  tasks: null
  val_tasks: null
  camera_map:                   # policy camera -> simulator camera (one each)
    observation.images.camera1: agentview
    observation.images.camera2: eye_in_hand
  camera_height: 360            # LeRobot LiberoEnvConfig default (lerobot-eval protocol)
  camera_width: 360
  action_slice: [0, 7]          # whole action vector; slicing is rejected
  action_scale: 1.0
  gripper_sign: 1.0             # smolvla_libero already outputs LIBERO's gripper convention
  env_gripper_dims: [6]
  n_exec_steps: 50              # = smolvla_libero n_action_steps, as in its SFT evaluation
  max_steps: 520                # LeRobot TASK_SUITE_MAX_STEPS: spatial/object 280, goal 300, libero_10 520
  max_decisions: 11             # ceil(max_steps / n_exec_steps)
  frame_every: 5
  max_cached_envs: 8

rl:
  group_size: 8                 # G rollouts per initial state / task
  sde_steps: 5                  # ReinFlow Euler-Maruyama steps per chunk
  adv_eps: 1.0e-8
  clip: 0.2                     # PPO-style ratio clip
  kl_coef: 0.01                 # k3 KL against the frozen SFT reference
  entropy_coef: 0.001           # entropy bonus on the ReinFlow noise head
  success_reward: 1.0
  position_weight: 0.3
  orientation_weight: 0.3
  target_pose_6d: null          # optional [x, y, z, r1..r6] handover target
  val_seed: 1234
  max_val_tasks: 4
  val_frames_per_task: 4

run:
  iters: 200
  lr: 1.0e-6
  micro_batch: 4
  device: "cuda"
  val_every: 10
  save_every: 25
  out_dir: "runs/reinflow_grpo"
  seed: 0
