# RL stage for LIBERO: ReinFlow-GRPO from this benchmark's own SFT model.
#   python3 scripts/benchmark.py train rl --benchmark libero
# The checkpoint, its normalisation and the simulator must all belong to libero
# (src/surgicalvla/rl/benchmarks.py). Reference start point for ablations:
#   checkpoint: "lerobot/smolvla_libero"  checkpoint_revision: "a24f1f380461b665158d52acd140152c79e8b36d"

project:
  wandb_project: "surgical-vla"
  wandb_mode: "online"
  entity: null
  run_name: "surgical_vla_libero_rl"
  notes: "ReinFlow-GRPO over flow-matching SDE trajectories (LIBERO)"
  tags: ["rl", "grpo", "reinflow", "libero"]

benchmark: libero
checkpoint: "outputs/libero/sft"   # newest saved policy under this dir is used
checkpoint_revision: null
stats:
  path: null                        # null -> the checkpoint's own saved normaliser

env:
  backend: lerobot                  # LeRobot make_env (as lerobot-eval); "socket" = legacy LIBERO bridge
  endpoint: null
  # init_states: false -> fresh layouts sampled from each task's placement regions (seeded).
  # The 50 fixed init states per task are LIBERO's evaluation states: RL never uses them.
  env_kwargs: {observation_height: 360, observation_width: 360, init_states: false}
  suite: "libero_10"
  tasks: null
  val_tasks: null
  camera_map:                       # policy camera -> simulator camera (one each)
    observation.images.camera1: image
    observation.images.camera2: image2
  action_slice: [0, 7]
  action_scale: 1.0
  action_clip: 1.0
  gripper_sign: 1.0
  env_gripper_dims: [6]
  n_exec_steps: 50
  max_steps: 520
  max_decisions: 11
  frame_every: 5
  val_suites: ["libero_spatial", "libero_object", "libero_goal", "libero_10"]   # null -> the training suite

# Joint SFT + RL. sequential = RL only from the SFT checkpoint; joint = GRPO + lambda_t * FM
# on a streamed demo batch; interleaved = sft_steps FM updates every interleave_every RL updates.
training:
  mode: sequential                  # sequential | joint | interleaved
  lambda: {start: 1.0, end: 0.1, kind: cosine, steps: 200}
  interleave_every: 1
  sft_steps: 1

demo:                               # streamed from the Hub; position saved in rl_state.pt
  repo_id: "lerobot/libero"
  revision: null
  batch_size: 8
  buffer_size: 1000
  episode_blocks: null
  rename_map:
    observation.images.image: observation.images.camera1
    observation.images.image2: observation.images.camera2

rl:
  group_size: 8                     # G rollouts per initial state
  sde_steps: 5
  adv_eps: 1.0e-8
  clip: 0.2
  kl_coef: 0.01                     # k3 KL against the frozen SFT reference
  entropy_coef: 0.001
  success_reward: 1.0
  position_weight: 0.3
  orientation_weight: 0.3
  target_pose_6d: null
  val_seed: 1234
  val_tasks_per_suite: 10           # validation: every suite x tasks x episodes (distinct init states)
  val_episodes_per_task: 2
  val_frames_per_task: 4

run:
  iters: 200
  lr: 1.0e-6
  micro_batch: 4
  device: "cuda"
  val_every: 10
  save_every: 25
  out_dir: "outputs/libero/rl"
  seed: 0
  resume: false                     # true -> continue from outputs/libero/rl/rl_state.pt
