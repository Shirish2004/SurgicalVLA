# RL stage for RoboTwin 2.0: ReinFlow-GRPO from this benchmark's own SFT model.
#   python3 scripts/benchmark.py train rl --benchmark robotwin
# The checkpoint, its normalisation and the simulator must all belong to robotwin
# (src/surgicalvla/rl/benchmarks.py). Reference start point for ablations:
#   checkpoint: "lerobot/smolvla_robotwin"  checkpoint_revision: "eb55d3a74f6cd26c6388aecd116b37b63fac144d"

project:
  wandb_project: "surgical-vla"
  wandb_mode: "online"
  entity: null
  run_name: "surgical_vla_robotwin_rl"
  notes: "ReinFlow-GRPO over flow-matching SDE trajectories (RoboTwin 2.0)"
  tags: ["rl", "grpo", "reinflow", "robotwin"]

benchmark: robotwin
checkpoint: "outputs/robotwin/sft"   # newest saved policy under this dir is used
checkpoint_revision: null
stats:
  path: null                        # null -> the checkpoint's own saved normaliser

env:
  backend: lerobot                  # LeRobot make_env (as lerobot-eval); "socket" = legacy LIBERO bridge
  endpoint: "tcp/127.0.0.1:7448"
  env_kwargs: {}
  suite: "adjust_bottle,beat_block_hammer,blocks_ranking_rgb,blocks_ranking_size,click_alarmclock,click_bell,dump_bin_bigbin,grab_roller,handover_block,handover_mic,hanging_mug,lift_pot,move_can_pot,move_pillbottle_pad,move_playingcard_away,move_stapler_pad,open_laptop,open_microwave,pick_diverse_bottles,pick_dual_bottles,place_a2b_left,place_a2b_right,place_bread_basket,place_bread_skillet,place_burger_fries,place_can_basket,place_cans_plasticbox,place_container_plate,place_dual_shoes,place_empty_cup,place_fan,place_mouse_pad,place_object_basket,place_object_scale,place_object_stand,place_phone_stand,place_shoe,press_stapler,put_bottles_dustbin,put_object_cabinet,rotate_qrcode,scan_object,shake_bottle,shake_bottle_horizontally,stack_blocks_three,stack_blocks_two,stack_bowls_three,stack_bowls_two,stamp_seal,turn_switch"
  tasks: null
  val_tasks: null
  camera_map:                       # policy camera -> simulator camera (one each)
    observation.images.camera1: head_camera
    observation.images.camera2: left_camera
    observation.images.camera3: right_camera
  action_slice: [0, 14]
  action_scale: 1.0
  action_clip: null   # absolute joint angles: never clip
  gripper_sign: 1.0
  env_gripper_dims: [6, 13]
  n_exec_steps: 50
  max_steps: 1200
  max_decisions: 24
  frame_every: 5

# Joint SFT + RL. sequential = RL only from the SFT checkpoint; joint = GRPO + lambda_t * FM
# on a streamed demo batch; interleaved = sft_steps FM updates every interleave_every RL updates.
training:
  mode: sequential                  # sequential | joint | interleaved
  lambda: {start: 1.0, end: 0.1, kind: cosine, steps: 200}
  interleave_every: 1
  sft_steps: 1

demo:                               # streamed from the Hub; position saved in rl_state.pt
  repo_id: "lerobot/robotwin_unified"
  revision: null
  batch_size: 8
  buffer_size: 1000
  episode_blocks: {block: 550, take: 50}   # demo_clean only
  rename_map:
    observation.images.cam_high: observation.images.camera1
    observation.images.cam_left_wrist: observation.images.camera2
    observation.images.cam_right_wrist: observation.images.camera3

rl:
  group_size: 8                     # G rollouts per initial state
  sde_steps: 5
  adv_eps: 1.0e-8
  clip: 0.2
  kl_coef: 0.01                     # k3 KL against the frozen SFT reference
  entropy_coef: 0.001
  success_reward: 1.0
  position_weight: 0.3
  orientation_weight: 0.3
  target_pose_6d: null
  val_seed: 1234
  max_val_tasks: 4
  val_frames_per_task: 4

run:
  iters: 200
  lr: 1.0e-6
  micro_batch: 4
  device: "cuda"
  val_every: 10
  save_every: 25
  out_dir: "outputs/robotwin/rl"
  seed: 0
  resume: false                     # true -> continue from outputs/robotwin/rl/rl_state.pt
