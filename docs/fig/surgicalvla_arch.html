const META={"img": {"title": "ot", "shape": "[2, 3, 512, 512] (resize + pad)", "info": "Third-person and wrist images, resized with padding to 512 px.", "params": "", "kind": "tensor"}, "lang": {"title": "ℓ", "shape": "[≤ 48] tokens", "info": "Task instruction, tokenised (max 48 tokens).", "params": "", "kind": "tensor"}, "frame": {"title": "o(1)t", "shape": "[H, W, 3]", "info": "The same third-person frame, given to the frozen perception. Only frame t is used: object inputs are past-only.", "params": "", "kind": "tensor"}, "state": {"title": "st", "shape": "[8] LIBERO (pad 32)", "info": "", "params": "", "kind": "tensor"}, "siglip": {"title": "SigLIP + connector", "shape": "[2, 3, 512, 512] → [128, 960]", "info": "SmolVLM2 vision encoder; 32×32 patches pooled 4× to 64 tokens per image.", "params": "≈ 93 M (frozen)", "kind": "frozen"}, "embed": {"title": "token embedding", "shape": "[48] → [48, 960]", "info": "", "params": "", "kind": "frozen"}, "percep": {"title": "frozen perception", "shape": "frame t → K = 4 objects × ([384] feat, [8] box·centroid·depth·score)", "info": "Per frame and without memory: the 3 best instances of the instruction's noun phrase plus the end effector. Cached offline for training; computed live at inference (236 ms per chunk).", "params": "SAM 3 848 M · DINOv2-S 22 M · DA-V2-S 25 M (all frozen, not in the policy)", "kind": "frozen"}, "objproj": {"title": "object projector", "shape": "[4, 384+8] → [4, 960]", "info": "", "params": "3.2 M", "kind": "train"}, "sproj": {"title": "state proj", "shape": "[32] → [1, 960]", "info": "", "params": "", "kind": "train"}, "lq": {"title": "latent queries q1..4", "shape": "[4, 960]", "info": "Latent reasoning tokens; their outputs predict the visual embedding of frame t+10.", "params": "", "kind": "train"}, "cotx": {"title": "explicit CoT text", "shape": "[≤ 48] tokens", "info": "‘<cot> phase: grasp | object: black bowl | motion: down </cot>’. Teacher-forced in training (fades out by the curriculum); at inference decoded every 10 chunks, or not at all once the curriculum has ended.", "params": "", "kind": "side"}, "prefix": {"title": "prefix", "shape": "[≈ 233, 960]", "info": "Order: images | text | objects (bidirectional) | state | CoT | latent queries (causal).", "params": "", "kind": "tensor"}, "vlm": {"title": "SmolVLM2 decoder", "shape": "[≈ 233, 960] → K, V per layer", "info": "Truncated VLM backbone; its per-layer keys and values are cached for the action expert.", "params": "≈ 303 M (frozen)", "kind": "frozen"}, "kv": {"title": "prefix KV cache", "shape": "16 × [≈ 233, 320] K, V", "info": "", "params": "", "kind": "frozen"}, "noisy": {"title": "xτ, τ", "shape": "[50, 32] + time", "info": "Flow matching: x_τ = τ ε + (1−τ) a, τ ~ Beta(1.5, 1); the expert predicts v = ε − a.", "params": "", "kind": "tensor"}, "expert": {"title": "action expert", "shape": "[50, 720] → [50, 720]", "info": "Each layer's FFN is a phase-conditioned MoE (router input: token, phase embedding, object context). Variants: upcycled, matched (1× compute), dense (= SmolVLA).", "params": "382 M (trainable, up-cycled MoE)", "kind": "train"}, "vout": {"title": "action out", "shape": "[50, 720] → [50, 32]", "info": "", "params": "", "kind": "train"}, "v": {"title": "vθ", "shape": "[50, 32] (7 used)", "info": "", "params": "", "kind": "tensor"}, "euler": {"title": "10 Euler", "shape": "", "info": "Inference: integrate the ODE from noise to the action chunk a_{t:t+50}; RL rollouts use the SDE with a learned noise head.", "params": "", "kind": "plain"}, "aux": {"title": "aux vision heads", "shape": "mean expert out [720] → [384], [2], [2], [3]", "info": "Training only. Reads the action expert, so the targets shape trainable features while the VLM is frozen.", "params": "0.96 M", "kind": "train"}, "lat": {"title": "latent predictor", "shape": "[4, 960] → [960]", "info": "", "params": "", "kind": "train"}, "ema": {"title": "EMA target encoder", "shape": "[960]", "info": "", "params": "", "kind": "frozen"}, "cothead": {"title": "CoT LM head", "shape": "[960] → vocab 49 280", "info": "", "params": "47 M", "kind": "train"}, "phase": {"title": "phase head", "shape": "", "info": "", "params": "", "kind": "train"}, "l_fm": {"title": "ℒFM", "shape": "", "info": "", "params": "", "kind": "loss"}, "l_aux": {"title": "ℒaux", "shape": "", "info": "", "params": "", "kind": "loss"}, "l_lat": {"title": "ℒlatent", "shape": "", "info": "", "params": "", "kind": "loss"}, "l_cot": {"title": "ℒCoT · ℒphase", "shape": "", "info": "", "params": "", "kind": "loss"}, "l_moe": {"title": "ℒbalance", "shape": "", "info": "", "params": "", "kind": "loss"}, "targets": {"title": "feature cache (offline)", "shape": "Parquet shards keyed (episode, frame)", "info": "Targets may use the whole episode; they are used only in losses. Inputs (object tokens) are past-only.", "params": "", "kind": "target"}}, EDGES=[{"id": "e0", "from": "img", "to": "siglip"}, {"id": "e1", "from": "lang", "to": "embed"}, {"id": "e2", "from": "frame", "to": "percep"}, {"id": "e3", "from": "percep", "to": "objproj"}, {"id": "e4", "from": "state", "to": "sproj"}, {"id": "e5", "from": "siglip", "to": "prefix"}, {"id": "e6", "from": "embed", "to": "prefix"}, {"id": "e7", "from": "objproj", "to": "prefix"}, {"id": "e8", "from": "sproj", "to": "prefix"}, {"id": "e9", "from": "cotx", "to": "prefix"}, {"id": "e10", "from": "lq", "to": "prefix"}, {"id": "e11", "from": "prefix", "to": "vlm"}, {"id": "e12", "from": "vlm", "to": "kv"}, {"id": "e13", "from": "kv", "to": "expert"}, {"id": "e14", "from": "noisy", "to": "expert"}, {"id": "e15", "from": "expert", "to": "vout"}, {"id": "e16", "from": "vout", "to": "v"}, {"id": "e17", "from": "v", "to": "euler"}, {"id": "e18", "from": "v", "to": "l_fm"}, {"id": "e19", "from": "expert", "to": "aux"}, {"id": "e20", "from": "aux", "to": "l_aux"}, {"id": "e21", "from": "vlm", "to": "lat"}, {"id": "e22", "from": "lat", "to": "l_lat"}, {"id": "e23", "from": "ema", "to": "l_lat"}, {"id": "e24", "from": "vlm", "to": "cothead"}, {"id": "e25", "from": "cothead", "to": "l_cot"}, {"id": "e26", "from": "phase", "to": "l_cot"}, {"id": "e27", "from": "expert", "to": "l_moe"}, {"id": "e28", "from": "targets", "to": "l_aux"}], TAGS=[{"tag": "objects", "label": "object tokens", "info": "Past-only perception → one token per object (object_input = objects)."}, {"tag": "cot", "label": "reasoning", "info": "Explicit CoT (teacher-forced, curriculum) and latent CoT (future visual latent)."}, {"tag": "aux", "label": "aux supervision", "info": "Label-free pseudo-targets, confidence-weighted, training only."}, {"tag": "trainable", "label": "trainable", "info": "≈ 442 M of 792 M parameters receive gradients (upcycled MoE)."}, {"tag": "loss", "label": "objective", "info": "ℒ = ℒ_FM + 0.1 ℒ_CoT + 0.01 ℒ_bal + 0.1 ℒ_phase + Σ w ℒ_aux + 0.1 ℒ_latent"}], STEPS=[{"nodes": ["img", "siglip", "lang", "embed"], "text": "Images and the instruction are embedded by SmolVLM2's frozen encoders (64 tokens per image)."}, {"nodes": ["frame", "percep", "objproj"], "text": "Frozen perception reads only the current frame: the target phrase's best 3 instances and the end effector become 4 object tokens."}, {"nodes": ["prefix", "lq", "cotx", "sproj"], "text": "The prefix is images | text | objects | state | CoT | latent queries."}, {"nodes": ["vlm", "kv"], "text": "The truncated, frozen SmolVLM2 (16 layers) processes the prefix once; its keys and values are cached."}, {"nodes": ["noisy", "expert", "vout", "v"], "text": "The trainable action expert (MoE FFNs) denoises a 50-step action chunk by cross-attending to the cached prefix."}, {"nodes": ["aux", "lat", "ema", "cothead", "phase", "targets"], "text": "Training-only heads: auxiliary vision targets, latent future-frame prediction, CoT tokens and phase, from the offline cache."}, {"nodes": ["l_fm", "l_aux", "l_lat", "l_cot", "l_moe"], "text": "All losses are summed with fixed weights; only flow matching drives the action output directly."}];
const svg=document.querySelector('#fig svg'), tip=document.getElementById('tip'), bar=document.getElementById('bar');
const $=id=>svg.getElementById?svg.getElementById(id):document.getElementById(id);
svg.querySelectorAll('title').forEach(t=>t.remove());
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/_\{([^}]+)\}/g,'<sub>$1</sub>').replace(/\^\{([^}]+)\}/g,'<sup>$1</sup>')}
svg.querySelectorAll('.node.ia').forEach(g=>{
  const m=META[g.id]; if(!m) return;
  g.addEventListener('mousemove',ev=>{
    tip.innerHTML='<b>'+fmt(m.title)+'</b>'+(m.shape?'<div><code>'+fmt(m.shape)+'</code></div>':'')+
      (m.info?'<div>'+fmt(m.info)+'</div>':'')+(m.params?'<div class="k">params: '+fmt(m.params)+'</div>':'')+
      '<div class="k">'+m.kind+'</div>';
    tip.style.display='block';
    const x=Math.min(ev.clientX+14,innerWidth-360), y=Math.min(ev.clientY+14,innerHeight-tip.offsetHeight-10);

  g.addEventListener('click',ev=>{ev.stopPropagation();trace(g.id)});

function reset(){svg.querySelectorAll('.dim,.hl').forEach(e=>e.classList.remove('dim','hl'));document.getElementById('step').textContent=''}
function highlight(nodes,edges){
  svg.querySelectorAll('.node,.edge').forEach(e=>e.classList.add('dim'));
  nodes.forEach(n=>{const e=$(n); if(e){e.classList.remove('dim');e.classList.add('hl')}});
  edges.forEach(n=>{const e=$(n); if(e){e.classList.remove('dim');e.classList.add('hl')}});}
function trace(id){
  const nodes=new Set([id]),edges=new Set();
  for(const dir of ['from','to']){const other=dir==='from'?'to':'from';let front=[id];
    while(front.length){const nx=[];for(const n of front)for(const e of EDGES)if(e[dir]===n&&!edges.has(e.id)){edges.add(e.id);
      if(!nodes.has(e[other])){nodes.add(e[other]);nx.push(e[other])}}front=nx}}
  highlight(nodes,edges);}
document.getElementById('fig').addEventListener('click',reset);
function btn(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=()=>fn(b);bar.appendChild(b);return b}
TAGS.forEach(t=>btn(t.label||t.tag,b=>{const on=!b.classList.contains('on');bar.querySelectorAll('button.tag').forEach(x=>x.classList.remove('on'));
  reset(); if(on){b.classList.add('on');const ns=[...svg.querySelectorAll('.node.tag-'+t.tag)].map(e=>e.id),
  es=[...svg.querySelectorAll('.edge.tag-'+t.tag)].map(e=>e.id);highlight(ns,es);document.getElementById('step').textContent=t.info||''}}).classList.add('tag'));
if(STEPS.length){let k=-1;const show=()=>{reset();if(k<0)return;const s=STEPS[k];highlight(s.nodes||[],

btn('SVG ⤓',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([svg.outerHTML],{type:'image/svg+xml'}));

  a.href=URL.createObjectURL(b);a.download='surgicalvla_arch.png';a.click()})};
