<text x="40.0" y="706.0" font-size="11" text-anchor="start" fill="#555555">trainable</text>
<rect x="112.5" y="696" width="14" height="12" fill="#dcebf7" stroke="#3f74a8"/>
<text x="132.5" y="706.0" font-size="11" text-anchor="start" fill="#555555">frozen</text>
<rect x="185.5" y="696" width="14" height="12" fill="#eeeeee" stroke="#777777"/>
<text x="205.5" y="706.0" font-size="11" text-anchor="start" fill="#555555">tensor</text>
<rect x="258.5" y="696" width="14" height="12" fill="#e6d9f2" stroke="#7a52a0"/>
<text x="278.5" y="706.0" font-size="11" text-anchor="start" fill="#555555">router conditioning</text>
<rect x="416.0" y="696" width="14" height="12" fill="#d9d9d9" stroke="#9a9a9a"/>
<text x="436.0" y="706.0" font-size="11" text-anchor="start" fill="#555555">expert not selected</text>
<text x="560.0" y="684.0" font-size="12" text-anchor="middle" fill="#555555" font-style="italic">All routed experts start as copies of SmolVLA's FFN; the dense variant (moe_variant = dense) is SmolVLA.</text>
