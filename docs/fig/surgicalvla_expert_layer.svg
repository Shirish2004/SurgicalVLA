<title>h′</title>
<rect x="1020.0" y="290.0" width="70.0" height="26.0" fill="#eeeeee" stroke="#777777" stroke-width="1.1"/>
<text x="1055.0" y="283.0" font-size="13" text-anchor="middle" fill="#222222" font-family="Menlo, Consolas, monospace">h′</text>
<text x="1055.0" y="330.0" font-size="11" text-anchor="middle" fill="#555555">→ layer ℓ+1</text>
</g>
<g id="n_phase" class="node " data-kind="plain">
<text x="36.0" y="556.0" font-size="12" text-anchor="start" fill="#555555">e_phase: phase_proj of the decoder output at the CoT phase token when the trace is fed;</text>
<text x="36.0" y="573.0" font-size="12" text-anchor="start" fill="#555555">a learned null vector otherwise, which includes every inference step after the curriculum.</text>
</g>
<g id="n_obj" class="node " data-kind="plain">
<text x="36.0" y="600.0" font-size="12" text-anchor="start" fill="#555555">c_obj: the object projector's context over the K = 4 object tokens (Fig. 1 ②).</text>
<text x="36.0" y="617.0" font-size="12" text-anchor="start" fill="#555555">FFN per layer 22.1 M (4 routed + 1 shared); active per token: shared + 2 of 4 = 3× the SmolVLA FFN compute.</text>
</g>
