<text x="915.0" y="306.7" font-size="15" text-anchor="middle" fill="#222222">Σ</text>
</g>
<g id="add2" class="node  ia" data-kind="op">
<title>+</title>
<circle cx="981.0" cy="302.0" r="13.0" fill="#ffffff" stroke="#444444" stroke-width="1.4"/>
<text x="981.0" y="306.7" font-size="15" text-anchor="middle" fill="#222222">+</text>
</g>
