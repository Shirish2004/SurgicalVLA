<text x="780.0" y="350.7" font-size="10.5" text-anchor="middle" fill="#555555">SwiGLU 720 → 2048 → 720</text>
</g>
<g id="shared" class="node  ia" data-kind="train">
<title>shared expert</title>
<rect x="700.0" y="390.0" width="160.0" height="42.0" rx="7" fill="#fde3c8" stroke="#d17a22" stroke-width="1.4"/>
<text x="780.0" y="407.2" font-size="12" text-anchor="middle" fill="#222222" font-weight="bold">shared expert</text>
<text x="780.0" y="422.7" font-size="10.5" text-anchor="middle" fill="#555555">always on</text>
</g>
<g id="mix" class="node  ia" data-kind="op">
