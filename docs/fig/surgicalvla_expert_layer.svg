<g id="hin" class="node  ia" data-kind="tensor">
<title>h</title>
<rect x="36.0" y="290.0" width="70.0" height="26.0" fill="#eeeeee" stroke="#777777" stroke-width="1.1"/>
<text x="71.0" y="283.0" font-size="13" text-anchor="middle" fill="#222222" font-family="Menlo, Consolas, monospace">h</text>
<text x="71.0" y="330.0" font-size="11" text-anchor="middle" fill="#555555">50 × 720</text>
</g>
<g id="kv" class="node  ia" data-kind="frozen">
<title>prefix K, V (layer ℓ)</title>
<rect x="150.0" y="104.0" width="110.0" height="24.0" fill="#dcebf7" stroke="#3f74a8" stroke-width="1.1"/>
<text x="205.0" y="97.0" font-size="13" text-anchor="middle" fill="#222222" font-family="Menlo, Consolas, monospace">prefix K, V (layer ℓ)</text>
<text x="205.0" y="142.0" font-size="11" text-anchor="middle" fill="#555555">from the frozen decoder</text>
</g>
<g id="attn" class="node  ia" data-kind="train">
<title>RMSNorm → attention · SmolVLA&#x27;s interleaving (self_attn_every_n_layers = 2).</title>
<rect x="140.0" y="240.0" width="200.0" height="126.0" rx="7" fill="#fde3c8" stroke="#d17a22" stroke-width="1.4"/>
<text x="240.0" y="265.1" font-size="13" text-anchor="middle" fill="#222222" font-weight="bold">RMSNorm → attention</text>
<text x="240.0" y="281.5" font-size="11.5" text-anchor="middle" fill="#555555">ℓ even: self-attention over</text>
<text x="240.0" y="298.5" font-size="11.5" text-anchor="middle" fill="#555555">[prefix ; chunk]</text>
<text x="240.0" y="315.5" font-size="11.5" text-anchor="middle" fill="#555555">ℓ odd: cross-attention to</text>
<text x="240.0" y="332.5" font-size="11.5" text-anchor="middle" fill="#555555">the prefix K, V</text>
<text x="240.0" y="349.5" font-size="11.5" text-anchor="middle" fill="#555555">1.84 M</text>
</g>
<g id="add1" class="node  ia" data-kind="op">
<title>+</title>
<circle cx="384.0" cy="303.0" r="12.0" fill="#ffffff" stroke="#444444" stroke-width="1.4"/>
<text x="384.0" y="307.7" font-size="15" text-anchor="middle" fill="#222222">+</text>
</g>
<g id="ephase" class="node  ia" data-kind="side">
<title>e_phase ∈ ℝ720</title>
<rect x="440.0" y="104.0" width="80.0" height="22.0" fill="#e6d9f2" stroke="#7a52a0" stroke-width="1.1"/>
<text x="480.0" y="97.0" font-size="13" text-anchor="middle" fill="#222222" font-family="Menlo, Consolas, monospace">e_phase ∈ ℝ<tspan baseline-shift="super" font-size="70%">720</tspan></text>
</g>
<g id="cobj" class="node  ia" data-kind="side">
<title>c_obj ∈ ℝ720</title>
<rect x="560.0" y="104.0" width="80.0" height="22.0" fill="#e6d9f2" stroke="#7a52a0" stroke-width="1.1"/>
<text x="600.0" y="97.0" font-size="13" text-anchor="middle" fill="#222222" font-family="Menlo, Consolas, monospace">c_obj ∈ ℝ<tspan baseline-shift="super" font-size="70%">720</tspan></text>
</g>
<g id="router" class="node  ia" data-kind="train">
<title>RMSNorm → router (fp32) · Routes each action token by its content, the manipulation phase and the target object. Switch load-balancing loss, weight 0.01.</title>
<rect x="430.0" y="248.0" width="220.0" height="110.0" rx="7" fill="#fde3c8" stroke="#d17a22" stroke-width="1.4"/>
<text x="540.0" y="273.6" font-size="13" text-anchor="middle" fill="#222222" font-weight="bold">RMSNorm → router (fp32)</text>
<text x="540.0" y="290.0" font-size="11.5" text-anchor="middle" fill="#555555">[h ; e_phase ; c_obj]</text>
<text x="540.0" y="307.0" font-size="11.5" text-anchor="middle" fill="#555555">ℝ<tspan baseline-shift="super" font-size="70%">2160</tspan> → 4 logits</text>
<text x="540.0" y="324.0" font-size="11.5" text-anchor="middle" fill="#555555">top-2 per action token</text>
<text x="540.0" y="341.0" font-size="11.5" text-anchor="middle" fill="#555555">9 k parameters</text>
</g>
