[workspace]
name = "surgicalvla"
version = "0.2.0"
description = "Skill-routed Mixture-of-Experts VLA for robotic surgery (LeRobot SmolVLA backbone)"
authors = ["Shirish"]
channels = ["conda-forge"]
platforms = ["linux-64"]

# default/dev/asr use Python 3.13 and the main feature.
# libero is an isolated Python 3.10 simulator environment.
[environments]
default = { features = ["py313", "main"], solve-group = "main" }
dev = { features = ["py313", "main", "dev"], solve-group = "main" }
asr = { features = ["py313", "main", "asr"], solve-group = "main" }
libero = { features = ["py310", "libero"], solve-group = "libero", no-default-feature = true }
# Benchmark evaluation through LeRobot's own sim integrations (lerobot-eval).
# Same solve group as training, so eval runs the exact torch/transformers/lerobot
# versions the policy was trained with; it only adds the simulator packages.
sim-eval = { features = ["py313", "main", "dev", "simeval"], solve-group = "main" }

[feature.py313.dependencies]
python = "3.13.*"
pip = "*"

[feature.py310.dependencies]
python = "3.10.*"
pip = "*"
pyyaml = "*"

# Install this project with its main runtime extra.
[feature.main.pypi-dependencies]
surgicalvla = { path = ".", editable = true, extras = ["main"] }

# Assumes sibling checkouts:
# parent/
#   SurgicalVLA/  (this project)
#   lerobot/      (LeRobot source checkout)
# Only the extras this project actually imports. `all` pulls in simulation envs
# (dm-control -> labmaze), whose Python 3.13 sdist build shells out to Bazel and
# fails on labmaze's undeclared @bazel_skylib dependency. The other envs don't
# need those packages, so don't resolve/build them here.
lerobot = { path = "./lerobot", editable = true, extras = ["dataset", "smolvla"] }

[feature.dev.pypi-dependencies]
pytest = ">=8.0"
ruff = ">=0.6"

[feature.asr.pypi-dependencies]
faster-whisper = ">=1.2.1"
noisereduce = ">=3.0.3"
sounddevice = ">=0.5.6"

# LIBERO simulator dependencies: no LeRobot or Python >=3.12 packages here.
[feature.libero.pypi-dependencies]
numpy = "==1.22.4"
mujoco = "==2.3.7"
numba = "==0.57.1"
scipy = ">=1.9,<1.12"
pillow = "*"
termcolor = "*"
robosuite = ">=1.4.0"
bddl = "==1.0.1"
gym = "==0.25.2"
easydict = "==1.9"
hydra-core = "==1.2.0"
matplotlib = "==3.5.3"
cloudpickle = "==2.1.0"
future = "==0.18.2"
opencv-python = "==4.6.0.66"

[feature.libero.activation.env]
PYTHONNOUSERSITE = "1"
PYTHONPATH = ""

# lerobot[libero] = lerobot[dataset,transformers-dep,scipy-dep] + hf-libero; the first
# three are already in `main`, so only the simulator and scipy are added here.
[feature.simeval.pypi-dependencies]
hf-libero = { version = ">=0.1.5,<0.2.0" }
scipy = ">=1.14.0,<2.0.0"
# lerobot[remote]: client for simulators served from LeRobot's Docker images
# (lerobot-env-server), e.g. LIBERO-Plus, which replaces hf-libero.
eclipse-zenoh = ">=1.9.0,<1.11.0"
msgpack = ">=1.1.0,<2.0.0"
# original LIBERO demonstrations (HDF5 with simulator states), used only to validate pseudo-labels
h5py = ">=3.10"

[feature.simeval.activation.env]
MUJOCO_GL = "egl"
PYOPENGL_PLATFORM = "egl"

# Short entry points (see scripts/benchmark.py --help):
#   pixi run -e dev train sft --benchmark libero --policy smolvla
#   pixi run -e dev eval --benchmark libero --checkpoint lerobot/smolvla_libero --revision <sha>
#   pixi run -e dev test
#   pixi run -e dev labels --suite libero_spatial --limit 3      # pseudo-labels + traces (+ videos)
#   pixi run -e dev pilot --suite libero_spatial --dry-run       # Step-4 ablation grid
#   pixi run -e dev smoke                                        # full-architecture smoke test
#   pixi run -e sim-eval python scripts/validate_pseudolabels.py --hdf5 <LIBERO demo file>
[feature.dev.tasks]
# each task takes the launcher's arguments, e.g. `pixi run -e dev train sft --benchmark libero`
cache = "python scripts/benchmark.py cache"            # feature/label cache + traces for one suite
train = "python scripts/benchmark.py train"            # sft | rl, per benchmark
eval = "python scripts/benchmark.py eval"              # protocol evaluation of any checkpoint
ablate = "python scripts/benchmark.py ablate"          # arms of configs/ablations/arms.yaml, train + eval
compare = "python scripts/compare_arms.py"             # paired comparison of two evaluated models
figures = "python scripts/collect_results.py && python scripts/make_figures.py && python scripts/build_baselines_doc.py"
test = "pytest -p no:warnings -q tests"
smoke = "python scripts/smoke_full_arch.py"
pilot = "python scripts/benchmark.py ablate"           # alias of ablate
labels = "python scripts/benchmark.py cache"           # alias of cache
