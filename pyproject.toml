[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "surgicalvla"
version = "0.2.0"
description = "Skill-routed Mixture-of-Experts Vision-Language-Action model for robotic surgery, built on LeRobot's SmolVLA"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Shirish" }]
keywords = [
  "surgery",
  "robotics",
  "VLA",
  "lerobot",
  "mixture-of-experts",
  "vision-language-action",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies are in the optional "main" extra so Pixi can keep
# them out of the Python 3.10 LIBERO environment.
dependencies = []

[project.optional-dependencies]
# LeRobot is installed from the local editable checkout by pixi.toml.
main = [
  "matplotlib>=3.8",
  "numpy>=2.0,<2.3",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "scipy>=1.11",
  "tensorboard>=2.16",
  "torch>=2.7,<2.12",
  "wandb>=0.24,<0.28",
]

asr = [
  "faster-whisper>=1.2.1",
  "noisereduce>=3.0.3",
  "sounddevice>=0.5.6",
]

dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/surgicalvla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
